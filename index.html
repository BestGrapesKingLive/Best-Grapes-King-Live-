        }
        .video-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            display: block;
            border: 1px solid rgba(255,255,255,0.1);

        }

        .scrolling-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffeb3b;
            color: #000000;
            white-space: nowrap;
            overflow: hidden;
            padding: 8px 0;
            font-weight: bold;
        }
        .scrolling-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 18s linear infinite;

        @keyframes marquee {
